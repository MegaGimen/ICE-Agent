# Add inside the llinker.com server block (/etc/nginx/sites-available/default, the :443 server).
# The ice-web.service listens on 127.0.0.1:8139; nginx strips the /ICE/ prefix before proxying.
location = /ICE { return 301 /ICE/; }
location ^~ /ICE/ {
    proxy_pass http://127.0.0.1:8139/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
